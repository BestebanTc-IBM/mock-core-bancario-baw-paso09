openapi: "3.0.3"
info:
  title: Servicio Desembolso Credito REST
  description: Servicio REST mock del Core Bancario para el Paso 09 Desembolso del proceso CrediCarro. Ejecuta abono en cuenta cliente y debito mas deposito en cuenta concesionario como transaccion atomica.
  version: "1.1.2"

servers:
  - url: https://mock-core-bancario-baw-paso09.vercel.app
    description: Servidor Vercel
  # - url: http://localhost:3009    comentado para compatibilidad BAW (un solo host)

tags:
  - name: desembolso
    description: Transaccion de desembolso del credito

paths:

  /api/v1/desembolso/ejecutar:
    post:
      tags:
        - desembolso
      summary: Ejecutar desembolso transaccion atomica
      description: Recibe los datos del SIPOC Paso 09 y ejecuta el abono del credito en la cuenta del cliente y el debito mas deposito en la cuenta del concesionario. Devuelve comprobanteTransferencia, planPagos y timestamp. Las tres firmas y pagoPolizasOk deben ser true.
      operationId: ejecutarDesembolso
      x-codegen-request-body-name: solicitudDesembolso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudDesembolso'
      responses:
        "201":
          description: Desembolso ejecutado. Comprobante, plan de pagos y timestamp generados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaDesembolso'
        "400":
          description: Campos obligatorios del SIPOC faltantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCamposFaltantes'
        "422":
          description: Precondicion fallida firmas o polizas incompletas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPrecondicion'
        "503":
          description: Core temporalmente no disponible modo demo-fallo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCore'

  /api/v1/desembolso/{comprobante}:
    get:
      tags:
        - desembolso
      summary: Consultar comprobante de desembolso
      description: Devuelve el estado de un comprobante de transferencia identificado por su numero con prefijo CET-.
      operationId: consultarComprobante
      parameters:
        - name: comprobante
          in: path
          required: true
          description: Numero de comprobante ej. CET-A1B2C3D4E5F6
          schema:
            type: string
      responses:
        "200":
          description: Estado del comprobante consultado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoComprobante'
        "404":
          description: Comprobante no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorComprobanteNoEncontrado'

  /health:
    get:
      tags:
        - desembolso
      summary: Healthcheck del servicio mock
      operationId: healthCheck
      responses:
        "200":
          description: Servicio disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:

    # ── Request ──────────────────────────────────────────────
    SolicitudDesembolso:
      type: object
      required:
        - firmas
        - polizas
        - credito
        - cliente
        - vehiculo
        - concesionario
      properties:
        firmas:
          $ref: '#/components/schemas/DatosFirmas'
        polizas:
          $ref: '#/components/schemas/DatosPolizas'
        credito:
          $ref: '#/components/schemas/DatosCredito'
        cliente:
          $ref: '#/components/schemas/DatosCliente'
        vehiculo:
          $ref: '#/components/schemas/DatosVehiculo'
        concesionario:
          $ref: '#/components/schemas/DatosConcesionario'

    # v1.1.0: tres firmas requeridas (firmaClienteOk, firmaBancoOk, firmaConcesionarioOk)
    DatosFirmas:
      type: object
      required:
        - firmaClienteOk
        - firmaBancoOk
        - firmaConcesionarioOk
      properties:
        firmaClienteOk:
          type: boolean
          description: Firma del cliente en el contrato paso 08 tw.local.firmas.firmaClienteOk
          example: true
        firmaBancoOk:
          type: boolean
          description: Firma automatica del banco paso 08 tw.local.firmas.firmaBancoOk
          example: true
        firmaConcesionarioOk:
          type: boolean
          description: Firma del concesionario en el contrato paso 08 tw.local.firmas.firmaConcesionarioOk
          example: true

    DatosPolizas:
      type: object
      required:
        - pagoPolizasOk
      properties:
        pagoPolizasOk:
          type: boolean
          description: Polizas emitidas y pagadas en paso 07 tw.local.polizas.pagoPolizasOk
          example: true

    DatosCredito:
      type: object
      required:
        - montoFinanciable
      properties:
        montoFinanciable:
          type: number
          format: float
          description: Monto a desembolsar en USD tw.local.credito.montoFinanciable
          example: 18000.00

    DatosCliente:
      type: object
      required:
        - cedulaIdentidad
        - cuentaCliente
      properties:
        # v1.1.1: cedulaIdentidad integer (solo digitos, sin prefijo V-)
        cedulaIdentidad:
          type: integer
          format: int32
          description: Numero de cedula del titular solo digitos tw.local.cliente.cedulaIdentidad
          example: 12345678
        cuentaCliente:
          type: string
          description: Cuenta bancaria del cliente tw.local.cliente.cuentaCliente
          example: "0134-0001-12-0012345678"

    DatosVehiculo:
      type: object
      required:
        - concesionario
      properties:
        concesionario:
          type: string
          description: Concesionario seleccionado A B o C tw.local.vehiculo.concesionario
          example: "A"

    DatosConcesionario:
      type: object
      required:
        - cuentaConcesionario
      properties:
        cuentaConcesionario:
          type: string
          description: Cuenta destino del concesionario tw.local.concesionario.cuentaConcesionario
          example: "0105-0002-81-1081234567"

    # ── Response 201 ──────────────────────────────────────────
    # v1.1.0: detalle comentado, timestamp subido a SalidaDesembolso
    RespuestaDesembolso:
      type: object
      properties:
        desembolso:
          $ref: '#/components/schemas/SalidaDesembolso'

    SalidaDesembolso:
      type: object
      description: Variables de salida SIPOC Paso 09. BAW mapea a tw.local.desembolso.*
      properties:
        comprobanteTransferencia:
          type: string
          description: Comprobante Electronico de Transferencia tw.local.desembolso.comprobanteTransferencia
          example: "CET-A1B2C3D4E5F6"
        planPagos:
          type: string
          description: Referencia del plan de pagos tw.local.desembolso.planPagos
          example: "PP-BANESCO-CREDICARRO"
        # v1.1.0: timestamp subido desde detalle al objeto principal
        timestamp:
          type: string
          description: Fecha y hora ISO-8601 de la transaccion tw.local.desembolso.timestamp
          example: "2026-09-17T10:15:00.000Z"

    # ── DetalleDesembolso DESACTIVADO v1.1.0 ─────────────────
    # Conservado como referencia para Fase 2 / auditoria / BAI.
    # Para reactivar: agregar detalle en RespuestaDesembolso.
    DetalleDesembolso:
      type: object
      properties:
        operacion:
          type: string
          example: "DESEMBOLSO_CREDITO_CREDICARRO"
        abonoCliente:
          $ref: '#/components/schemas/DetalleAbonoCliente'
        pagoConcesionario:
          $ref: '#/components/schemas/DetallePagoConcesionario'
        sistema:
          type: string
          example: "Core Bancario IBM i/AS400 (mock)"

    DetalleAbonoCliente:
      type: object
      properties:
        cuentaDestino:
          type: string
          example: "0134-0001-12-0012345678"
        titular:
          type: integer
          format: int32
          example: 12345678
        montoAbonadoUsd:
          type: number
          format: float
          example: 18000.00
        descripcion:
          type: string
          example: "Abono credito Credi-Carro"

    DetallePagoConcesionario:
      type: object
      properties:
        cuentaDebito:
          type: string
          example: "0134-0001-12-0012345678"
        concesionario:
          type: string
          example: "A"
        cuentaCredito:
          type: string
          example: "0105-0002-81-1081234567"
        montoTransferidoUsd:
          type: number
          format: float
          example: 18000.00
        descripcion:
          type: string
          example: "Pago concesionario A Credi-Carro"

    # ── Response GET /comprobante ─────────────────────────────
    EstadoComprobante:
      type: object
      properties:
        comprobante:
          type: string
          example: "CET-A1B2C3D4E5F6"
        tipo:
          type: string
          example: "COMPROBANTE_TRANSFERENCIA"
        estado:
          type: string
          example: "EJECUTADO"
        planPagos:
          type: string
          example: "PP-BANESCO-CREDICARRO"
        timestampConsulta:
          type: string
          example: "2026-09-17T10:30:00.000Z"
        nota:
          type: string
          example: "Operacion registrada por mock valida solo para PoC."

    # ── Errores ───────────────────────────────────────────────
    ErrorCamposFaltantes:
      type: object
      properties:
        error:
          type: string
          example: "CAMPOS_REQUERIDOS_FALTANTES"
        mensaje:
          type: string
          example: "Faltan campos obligatorios del SIPOC Paso 09."
        camposFaltantes:
          type: array
          items:
            type: string

    ErrorPrecondicion:
      type: object
      properties:
        error:
          type: string
          example: "PRECONDICION_FALLIDA"
        mensaje:
          type: string
          example: "El contrato no esta completamente firmado."
        desembolso:
          $ref: '#/components/schemas/SalidaFallo'

    ErrorCore:
      type: object
      properties:
        error:
          type: string
          example: "CORE_NO_DISPONIBLE"
        mensaje:
          type: string
          example: "Core bancario temporalmente fuera de linea modo demo-fallo."
        desembolso:
          $ref: '#/components/schemas/SalidaFallo'

    SalidaFallo:
      type: object
      properties:
        comprobanteTransferencia:
          type: string
          example: ""
        planPagos:
          type: string
          example: ""
        timestamp:
          type: string
          example: ""

    ErrorComprobanteNoEncontrado:
      type: object
      properties:
        error:
          type: string
          example: "COMPROBANTE_NO_ENCONTRADO"
        mensaje:
          type: string
          example: "No se encontro el comprobante en el registro mock."

    # ── Healthcheck ───────────────────────────────────────────
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "UP"
        servicio:
          type: string
          example: "mock-core-bancario"
        paso:
          type: string
          example: "09 Desembolso"
        timestamp:
          type: string
          example: "2026-09-17T10:00:00.000Z"
