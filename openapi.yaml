openapi: "3.0.3"
info:
  title: Core Bancario Mock — Paso 09 Desembolso
  description: >
    API Mock que simula el Core bancario IBM i/AS400 para el Paso 09 (Desembolso)
    del Proceso 1 CrediCarro — PoC BOAT Banesco.
    BAW invoca este servicio desde un único serviceTask (Task_09_Desembolso)
    que ejecuta las dos operaciones como una transacción atómica.
    Entregable: Comprobante Electrónico de Transferencia + referencia del Plan de Pagos.
  version: "1.1.1"
  contact:
    name: PoC BOAT Banesco — IBM
    email: ibm-poc@demo.com

servers:
  - url: https://mock-core-bancario-baw-paso09.vercel.app
    description: Vercel (PoC — producción)
  - url: http://localhost:3009
    description: Local (desarrollo)

tags:
  - name: desembolso
    description: Transacción de desembolso del crédito

paths:

  /api/v1/desembolso/ejecutar:
    post:
      tags: [desembolso]
      summary: Ejecutar desembolso — transacción atómica
      description: >
        Recibe los datos del SIPOC Paso 09 y ejecuta en una sola operación:
        el abono del crédito en la cuenta del cliente y el débito+depósito
        en la cuenta del concesionario.
        Devuelve desembolso.comprobanteTransferencia, desembolso.planPagos
        y desembolso.timestamp — las variables de salida del SIPOC Paso 09.
        Valida las guardas de entrada: las tres firmas (cliente, banco,
        concesionario) y polizas.pagoPolizasOk deben ser true para proceder.
      operationId: ejecutarDesembolso
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudDesembolso'
            example:
              firmas:
                firmaClienteOk: true
                firmaBancoOk: true
                firmaConcesionarioOk: true
              polizas:
                pagoPolizasOk: true
              credito:
                montoFinanciable: 18000.00
              cliente:
                cedulaIdentidad: 12345678
                cuentaCliente: "0134-0001-12-0012345678"
              vehiculo:
                concesionario: "A"
              concesionario:
                cuentaConcesionario: "0105-0002-81-1081234567"
      responses:
        "201":
          description: Desembolso ejecutado. Comprobante, plan de pagos y timestamp generados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RespuestaDesembolso'
              example:
                desembolso:
                  comprobanteTransferencia: "CET-A1B2C3D4E5F6"
                  planPagos: "PP-BANESCO-CREDICARRO"
                  timestamp: "2026-09-17T10:15:00.000Z"
                # detalle: (comentado — se mantiene en el schema como referencia,
                #   no se incluye en la respuesta activa. Ver DetalleDesembolso.)
        "400":
          description: Campos obligatorios del SIPOC faltantes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCamposFaltantes'
        "422":
          description: Precondición fallida — firmas o pólizas incompletas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorPrecondicion'
        "503":
          description: Core temporalmente no disponible (modo demo-fallo)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorCore'

  /api/v1/desembolso/{comprobante}:
    get:
      tags: [desembolso]
      summary: Consultar comprobante de desembolso
      operationId: consultarComprobante
      parameters:
        - name: comprobante
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Estado del comprobante
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EstadoComprobante'
        "404":
          description: Comprobante no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorComprobanteNoEncontrado'

  /health:
    get:
      tags: [desembolso]
      summary: Healthcheck
      operationId: healthCheck
      responses:
        "200":
          description: Servicio disponible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

# ──────────────────────────────────────────────────────────────
# SCHEMAS
# Restricciones BAW:
#   - Sin allOf / oneOf / anyOf / not
#   - Sin integer format:int64
#   - Sin enum
#   - Nombres de propiedad: identificadores JS válidos (sin guiones)
# ──────────────────────────────────────────────────────────────
components:
  schemas:

    # ── Request body ──────────────────────────────────────────
    SolicitudDesembolso:
      type: object
      required: [firmas, polizas, credito, cliente, vehiculo, concesionario]
      properties:
        firmas:
          $ref: '#/components/schemas/DatosFirmas'
        polizas:
          $ref: '#/components/schemas/DatosPolizas'
        credito:
          $ref: '#/components/schemas/DatosCredito'
        cliente:
          $ref: '#/components/schemas/DatosCliente'
        vehiculo:
          $ref: '#/components/schemas/DatosVehiculo'
        concesionario:
          $ref: '#/components/schemas/DatosConcesionario'

    # CAMBIO v1.1.0: se agregan firmaClienteOk y firmaBancoOk.
    # Las tres firmas del paso 08 (Formalización) son obligatorias
    # para que el Paso 09 pueda ejecutarse.
    #   firmaClienteOk      → tw.local.firmas.firmaClienteOk
    #   firmaBancoOk        → tw.local.firmas.firmaBancoOk      (auto — sistema)
    #   firmaConcesionarioOk→ tw.local.firmas.firmaConcesionarioOk
    DatosFirmas:
      type: object
      required:
        - firmaClienteOk
        - firmaBancoOk
        - firmaConcesionarioOk
      properties:
        firmaClienteOk:
          type: boolean
          description: Firma del cliente en el contrato (paso 08) — tw.local.firmas.firmaClienteOk
          example: true
        firmaBancoOk:
          type: boolean
          description: Firma automática del banco (paso 08) — tw.local.firmas.firmaBancoOk
          example: true
        firmaConcesionarioOk:
          type: boolean
          description: Firma del concesionario en el contrato (paso 08) — tw.local.firmas.firmaConcesionarioOk
          example: true

    DatosPolizas:
      type: object
      required: [pagoPolizasOk]
      properties:
        pagoPolizasOk:
          type: boolean
          description: Pólizas emitidas y pagadas en paso 07 — tw.local.polizas.pagoPolizasOk
          example: true

    DatosCredito:
      type: object
      required: [montoFinanciable]
      properties:
        montoFinanciable:
          type: number
          format: double
          description: Monto a desembolsar en USD — tw.local.credito.montoFinanciable
          example: 18000.00

    DatosCliente:
      type: object
      required: [cedulaIdentidad, cuentaCliente]
      properties:
        # CAMBIO v1.1.1: cedulaIdentidad string → integer (solo número, sin prefijo V-)
        cedulaIdentidad:
          type: integer
          description: Número de cédula del titular (solo dígitos) — tw.local.cliente.cedulaIdentidad
          example: 12345678
        cuentaCliente:
          type: string
          description: Cuenta bancaria del cliente — tw.local.cliente.cuentaCliente
          example: "0134-0001-12-0012345678"

    DatosVehiculo:
      type: object
      required: [concesionario]
      properties:
        concesionario:
          type: string
          description: Concesionario seleccionado (A, B o C) — tw.local.vehiculo.concesionario
          example: "A"

    DatosConcesionario:
      type: object
      required: [cuentaConcesionario]
      properties:
        cuentaConcesionario:
          type: string
          description: Cuenta destino del concesionario — tw.local.concesionario.cuentaConcesionario
          example: "0105-0002-81-1081234567"

    # ── Response 201 ──────────────────────────────────────────
    # CAMBIO v1.1.0: el objeto 'detalle' se COMENTA (no se elimina).
    # El campo 'timestamp' sube al objeto principal 'desembolso'
    # para que BAW pueda mapearlo directamente como
    # tw.local.desembolso.timestamp sin necesidad de navegar detalle.
    RespuestaDesembolso:
      type: object
      properties:
        desembolso:
          $ref: '#/components/schemas/SalidaDesembolso'
        # detalle:                              ← COMENTADO (v1.1.0)
        #   $ref: '#/components/schemas/DetalleDesembolso'
        #   El objeto detalle queda desactivado de la respuesta activa.
        #   Se conserva el schema DetalleDesembolso más abajo como
        #   referencia para Fase 2 / auditoría / BAI.

    # Variables de salida SIPOC Paso 09 — BAW mapea a tw.local.desembolso.*
    # CAMBIO v1.1.0: se agrega 'timestamp' (antes vivía dentro de detalle).
    SalidaDesembolso:
      type: object
      description: >
        Variables de salida SIPOC Paso 09.
        BAW mapea a tw.local.desembolso.*
      properties:
        comprobanteTransferencia:
          type: string
          description: Comprobante Electrónico de Transferencia — tw.local.desembolso.comprobanteTransferencia
          example: "CET-A1B2C3D4E5F6"
        planPagos:
          type: string
          description: Referencia del plan de pagos (estática) — tw.local.desembolso.planPagos
          example: "PP-BANESCO-CREDICARRO"
        timestamp:
          type: string
          description: >
            Fecha y hora ISO-8601 de la transacción en el Core bancario.
            Antes en detalle.timestamp — subido al objeto principal en v1.1.0
            para simplificar el mapeo BAW: tw.local.desembolso.timestamp
          example: "2026-09-17T10:15:00.000Z"

    # ── DetalleDesembolso — DESACTIVADO en respuesta activa (v1.1.0) ──────
    # Conservado como referencia para Fase 2 / auditoría / BAI.
    # Para reactivarlo: descomentar 'detalle' en RespuestaDesembolso.
    DetalleDesembolso:
      type: object
      properties:
        operacion:
          type: string
          example: "DESEMBOLSO_CREDITO_CREDICARRO"
        # timestamp movido a SalidaDesembolso.timestamp en v1.1.0
        abonoCliente:
          $ref: '#/components/schemas/DetalleAbonoCliente'
        pagoConcesionario:
          $ref: '#/components/schemas/DetallePagoConcesionario'
        sistema:
          type: string
          example: "Core Bancario IBM i/AS400 (mock)"

    DetalleAbonoCliente:
      type: object
      properties:
        cuentaDestino:
          type: string
          example: "0134-0001-12-0012345678"
        titular:
          type: integer
          example: 12345678
        montoAbonadoUsd:
          type: number
          format: double
          example: 18000.00
        descripcion:
          type: string
          example: "Abono crédito Crédi-Carro"

    DetallePagoConcesionario:
      type: object
      properties:
        cuentaDebito:
          type: string
          example: "0134-0001-12-0012345678"
        concesionario:
          type: string
          example: "A"
        cuentaCredito:
          type: string
          example: "0105-0002-81-1081234567"
        montoTransferidoUsd:
          type: number
          format: double
          example: 18000.00
        descripcion:
          type: string
          example: "Pago concesionario A — Crédi-Carro"

    # ── Response GET /comprobante ─────────────────────────────
    EstadoComprobante:
      type: object
      properties:
        comprobante:
          type: string
          example: "CET-A1B2C3D4E5F6"
        tipo:
          type: string
          example: "COMPROBANTE_TRANSFERENCIA"
        estado:
          type: string
          example: "EJECUTADO"
        planPagos:
          type: string
          example: "PP-BANESCO-CREDICARRO"
        timestampConsulta:
          type: string
          example: "2026-09-17T10:30:00.000Z"
        nota:
          type: string
          example: "Operación registrada por mock — válida solo para PoC."

    # ── Errores ───────────────────────────────────────────────
    ErrorCamposFaltantes:
      type: object
      properties:
        error:
          type: string
          example: "CAMPOS_REQUERIDOS_FALTANTES"
        mensaje:
          type: string
          example: "Faltan campos obligatorios del SIPOC Paso 09."
        camposFaltantes:
          type: array
          items:
            type: string
          example:
            - "firmas.firmaClienteOk"
            - "firmas.firmaBancoOk"
            - "cliente.cuentaCliente"

    ErrorPrecondicion:
      type: object
      properties:
        error:
          type: string
          example: "PRECONDICION_FALLIDA"
        mensaje:
          type: string
          example: "El contrato no está completamente firmado — las tres firmas (cliente, banco, concesionario) deben ser true."
        desembolso:
          $ref: '#/components/schemas/SalidaFallo'

    ErrorCore:
      type: object
      properties:
        error:
          type: string
          example: "CORE_NO_DISPONIBLE"
        mensaje:
          type: string
          example: "Core bancario temporalmente fuera de línea (modo demo-fallo)."
        desembolso:
          $ref: '#/components/schemas/SalidaFallo'

    SalidaFallo:
      type: object
      properties:
        comprobanteTransferencia:
          type: string
          nullable: true
          example: null
        planPagos:
          type: string
          nullable: true
          example: null
        timestamp:
          type: string
          nullable: true
          example: null

    ErrorComprobanteNoEncontrado:
      type: object
      properties:
        error:
          type: string
          example: "COMPROBANTE_NO_ENCONTRADO"
        mensaje:
          type: string
          example: "No se encontró el comprobante 'INVALIDO-999' en el registro mock."

    # ── Healthcheck ───────────────────────────────────────────
    HealthResponse:
      type: object
      properties:
        status:
          type: string
          example: "UP"
        servicio:
          type: string
          example: "mock-core-bancario"
        paso:
          type: string
          example: "09 · Desembolso"
        timestamp:
          type: string
          example: "2026-09-17T10:00:00.000Z"
